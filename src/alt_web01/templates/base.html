<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ title }} - alt_web01{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<!-- 顶部导航条：全局唯一，使用 Bootstrap 5 下拉菜单 -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('main.index') }}">
            <span class="brand-dot"></span>alt_web01
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
                aria-label="切换导航">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">

                <!-- 首页 -->
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}"
                       href="{{ url_for('main.index') }}">首页</a>
                </li>

                <!-- 学生 -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle {% if request.path.startswith('/students') %}active{% endif %}"
                       href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">学生</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="{{ url_for('students.add_manual') }}">手工添加学生</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('students.add_bulk_small') }}">批量添加学生（小数据量）</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('students.add_bulk_large') }}">批量添加学生（大数据量）</a></li>
                    </ul>
                </li>

                <!-- 大学 -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle {% if request.path.startswith('/universities') %}active{% endif %}"
                       href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">大学</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="{{ url_for('universities.add_manual') }}">手工添加大学</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('universities.add_major_group') }}">手工添加专业组</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('universities.add_auto') }}">自动添加大学和专业组</a></li>
                    </ul>
                </li>

                <!-- 入学 -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle {% if request.path.startswith('/enrollment') %}active{% endif %}"
                       href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">入学</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="{{ url_for('enrollment.manual') }}">手动入学</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('enrollment.auto') }}">自动入学</a></li>
                    </ul>
                </li>

                <!-- 统计分析 -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle {% if request.path.startswith('/stats') %}active{% endif %}"
                       href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">统计分析</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="{{ url_for('stats.yearly') }}">历年学生数量统计</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('stats.by_university') }}">各大学学生数量统计</a></li>
                    </ul>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- 页面主体：由子模板填充 -->
<main class="main-content">
    {% block content %}{% endblock %}
</main>

<!-- 页脚 -->
<footer class="footer text-center py-3">
    <div class="container">
        <span class="text-muted">alt_web01 · 大学生入学、毕业模拟系统（演示）</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
