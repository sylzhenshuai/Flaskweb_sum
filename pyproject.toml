[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alt_web01"
version = "0.2.1"
description = "大学生入学、毕业模拟系统演示网站（Flask）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "leon" }]
requires-python = ">=3.13"
# 运行时还需三个 GitHub 托管的上游包（PyPI 未发布），使用 Git URL 固定 tag。
dependencies = [
    "flask>=3.0",
    "openai>=3.3.1",
    "pandas>=2.0",
    "sedb-mysql @ git+https://github.com/sylzhenshuai/scdb_mysql_speed.git@ver0.2.0",
    "python-dotenv>=1.0",
    "random-student-info @ git+https://github.com/sylzhenshuai/random_student_info.git@ver0.1.3",
    "sclog-lite @ git+https://github.com/sylzhenshuai/sun_course.git@ver0.2.1"
]

[project.optional-dependencies]
deploy = [
    "gunicorn>=21.0",
]
dev = [
    "mypy>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alt_web01 = [
    "templates/*.html",
    "templates/students/*.html",
    "templates/enrollment/*.html",
    "templates/universities/*.html",
    "static/css/*.css",
]
