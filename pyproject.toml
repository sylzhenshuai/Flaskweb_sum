[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alt_web01"
version = "0.2.1"
description = "大学生入学、毕业模拟系统演示网站（Flask）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "leon" }]
requires-python = ">=3.13"
# 运行时还需两个 GitHub 托管的上游包（PyPI 未发布），固定到 tag 压缩包。
dependencies = [
    "flask>=3.0",
    "pandas>=2.0",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "random-student-info @ https://github.com/sylzhenshuai/random_student_info/archive/refs/tags/ver0.1.3.zip",
    "sclog-lite @ https://github.com/sylzhenshuai/sun_course/archive/refs/tags/ver0.2.1.zip"
]

[project.optional-dependencies]
deploy = [
    "gunicorn>=21.0",
]
dev = [
    "mypy>=2.0",
    "types-PyMySQL",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alt_web01 = [
    "templates/*.html",
    "templates/students/*.html",
    "static/css/*.css",
]
